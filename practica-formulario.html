<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Formulario Elegante y Responsivo</title>
    <link rel="stylesheet" href="./css/estilos-formularios.css"> <!-- Enlaza tu archivo CSS aquí -->
</head>
<body>

    <form class="form-elegante" action="#" method="POST">
        
        <!-- Campo de texto (Input Text) -->
        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="text" id="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>

        <!-- Menú desplegable (Select) -->
        <div class="form-group">
            <label for="pais">País de residencia:</label>
            <select id="pais" name="pais">
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="pe">Perú</option>
                <option value="mx">México</option>
                <option value="ar">Argentina</option>
                <option value="co">Colombia</option>
            </select>
        </div>

        <!-- Botón de envío -->
        <div class="form-group">
            <button type="submit">Enviar formulario</button>
        </div>

    </form>

</body>
</html>
